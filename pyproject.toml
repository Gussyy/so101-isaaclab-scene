[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-scene"
version = "0.1.0"
description = "SO-ARM101 scene and reach task for Isaac Lab 3.0 (Newton / PhysX)"
requires-python = "==3.12.*"
# isaaclab, isaacsim and torch are provided by the Isaac Lab environment, not resolved here.
dependencies = []

[tool.setuptools.packages.find]
include = ["so101_scene*"]
