# A deformable block in the SO-101 scene, simulated by Newton's VBD solver.
#
#   python scripts/run.py --config configs/soft_body.yaml --describe
#   python scripts/run.py --config configs/soft_body.yaml --steps 0 --viz kit
#
# =====================================================================================
#  READ THIS BEFORE BELIEVING THE BLOCK
#  k_mu and k_lambda are SOLVER STIFFNESSES -- Lame parameters -- not a material you
#  could look up. Nothing here has been identified against real rubber or foam. Treat
#  the behaviour as plausible, not predictive. docs/PHYSICS.md says what that costs you.
#
#  WHAT THE DIALS DO
#    k_mu         resists shear. Raise to make it hold its shape.
#    k_lambda     resists volume change. Raise alone and it acts like a water balloon.
#    k_damp       internal damping. Raise if it wobbles forever.
#    density      kg/m^3. 100 is a light foam.
#
#  Volume deformables are tetrahedralised at spawn, which needs a package the default
#  Isaac Lab install omits:   pip install "pytetwild[all]>=0.3.0,<0.4"
#
#  The task machinery still tracks the rigid cube -- rewards, terminations and the goal
#  command are all about `object`. The block is here to interact with, not to be scored
#  on. Drive it with the keyboard and push it around.
# =====================================================================================

meta:
  name: so101-soft-body
  notes: Deformable demo. No policy has been trained against this.

task: pick_place

scene:
  num_envs: 4          # deformables are particle-based; this is tens, not thousands
  env_spacing: 1.0
  robot:
    type: so101
    rot: [0.0, 0.0, 0.70710678, 0.70710678]
    collision_approximation: convexHull
    joint_pos:
      shoulder_pan: 0.0
      shoulder_lift: -0.6
      elbow_flex: 0.8
      wrist_flex: 0.6
      wrist_roll: 0.0
      gripper: 0.0
  objects:
    blob:
      type: soft_body
      size: [0.05, 0.05, 0.05]
      pos: [0.18, 0.0, 0.10]      # dropped above the table, in front of the arm
      k_mu: 3.0e3                 # shear stiffness -- see the note below on why this is low
      k_lambda: 3.0e3             # volume stiffness
      k_damp: 0.5
      density: 300.0
      color: [0.95, 0.85, 0.10]
  cameras:
    demo_cam:
      type: tiled
      prim_path: "{ENV_REGEX_NS}/DemoCam"
      resolution: [640, 480]
      pos: [0.55, 0.42, 0.34]
      look_at: [0.16, 0.0, 0.05]
      focal_length: 22.0

sim:
  episode_length_s: 60.0          # long: nothing here is being scored, so do not reset it
  physics: newton_vbd

control:
  source: zero
  action_horizon: 1
