# Drive the SO-101 from a VR controller: the arm follows the controller's pose through IK.
#
#   # terminal 1 -- the bridge (serves the WebXR page and turns controller poses into actions)
#   python scripts/vr_gripper_server.py
#
#   # terminal 2 -- the simulator. No window: the headset has the screens, and the Kit viewer
#   # costs 25 ms a step (docs/VR.md). Add --viz kit to watch on the monitor anyway.
#   python scripts/run.py --config configs/vr_teleop.yaml --steps 0
#
#   # on the Quest: open the URL the bridge prints, accept the certificate once, Enter VR.
#   # Hold GRIP to move the arm (clutch), TRIGGER closes the jaw, A/X re-centres.
#
#   # no headset yet? the same chain, driven by a scripted controller:
#   python scripts/vr_gripper_server.py --fake
#
# =====================================================================================
#  WHAT THIS IS
#  `control.actions: ik` swaps the task's five joint offsets for one grasp-point pose:
#  the action is [x, y, z, qx, qy, qz, qw, jaw], eight wide, in the robot's root frame --
#  the same layout scripts/floating_gripper.py already takes from the webcam hand tracker.
#  The VR bridge is one more thing on that socket. Nothing else changed.
#
#  MEASURED with the scripted controller (--fake): 4-20 mm tracking inside the arm's reach;
#  the block below is closed on, lifted 31 mm and carried, then dropped on its side partway.
#  The chain works; not every pick succeeds. docs/VR.md.
#
#  Rigid and PhysX, on purpose. This is the scene where rendering is cheap (45.6 steps/s
#  with a 640x480 camera); a Newton deformable scene renders at 1.9 and is not
#  teleoperable. docs/PHYSICS.md.
#
#  UNVERIFIED UNTIL A HEADSET IS PLUGGED IN: the WebXR page in the Quest's own browser.
#  Everything downstream of it -- the socket, the frame conversion, the clutch, the IK,
#  the arm -- is exercised by `--fake` and by the page's desktop mouse mode. docs/VR.md
#  says exactly which line is the untested one.
# =====================================================================================

meta:
  name: so101-vr-teleop
  notes: Controller pose -> IK -> arm. The Quest page itself is untested until a headset is on.

task: pick_place

scene:
  num_envs: 1
  env_spacing: 1.0
  spawn_jitter: false       # the block spawns where `pos` says, every reset (the task jitters it)
  debug_markers: false      # no goal-pose / grasp-frame markers floating in the operator's view
  robot:
    type: so101_full        # the parallel gripper; IK is wired for this robot only
    pos: [0.0, -0.23, 0.0]   # LeHome's garment task puts its two SO-101s 0.46 m apart  # the RIGHT arm, driven by the right controller; the left arm is 30 cm over
    rot: [0.0, 0.0, 0.0, 1.0]
    # The folded rest pose of the real arm: upper arm leaning back, forearm folded down over
    # it, gripper resting in front of the base with the fingers pointing down, 20 degrees
    # forward of vertical. From the posture grid in docs/VR.md: grasp point (0.112, 0, 0.091),
    # finger tips at (0.144, 0.002), the housing on the table. The joints sit just inside
    # their limits (-1.745, 1.690). This is where the arm starts, where B (reset) puts it,
    # and where A glides it back to; the bridge reads the point from the simulator, so
    # `--home` is not needed. To pick from the table the operator tilts the wrist back so the
    # finger tips point slightly up -- the tilt that reaches 68 mm at x = 0.27 (docs/VR.md).
    joint_pos:
      shoulder_pan: 0.0
      shoulder_lift: -1.65
      elbow_flex: 1.65
      wrist_flex: 1.3
      wrist_roll: 0.0
    # Stiffer arm servos than the asset's 17.8 / 0.6. MEASURED: at those gains the shoulder
    # holds 0.10-0.12 rad of error against gravity at reach (1.8-2.2 N.m), which is 45 mm at
    # the fingers, and the task-space IK -- which steps from the current pose each time --
    # never closes it: a commanded descent to 70 mm stopped at 118 mm on CPU and GPU alike.
    # 200 N.m/rad leaves 0.01 rad (about 3 mm); 5 N.m.s/rad keeps it from ringing. The real
    # STS3215 is a stiff position servo, so this is nearer the hardware, not further.
    arm:
      stiffness: 200.0
      damping: 5.0
  # The LEFT arm, driven by the left controller: the same robot, pose and gains, 30 cm to the
  # left. Its grasp frame rides the packet as ee_pose2 and its eight actions follow the first
  # arm's eight. It is scenery to the task's reward; a robot to the operator.
  robot2:
    type: so101_full
    pos: [0.0, 0.23, 0.0]
    rot: [0.0, 0.0, 0.0, 1.0]
    joint_pos:
      shoulder_pan: 0.0
      shoulder_lift: -1.65
      elbow_flex: 1.65
      wrist_flex: 1.3
      wrist_roll: 0.0
    arm:
      stiffness: 200.0
      damping: 5.0
  objects:
    # Clothes folding: a T-shirt as PhysX cloth (a surface deformable -- the particle cloth
    # LeHome used is gone from this PhysX; docs/VR.md) between the arms, flat on the table.
    # `object` is the rigid thing the task's terms watch; nothing here is scored, so it is a
    # 2 cm cube parked behind the left arm, out of every camera. The crate scene is
    # configs/vr_teleop_crate.yaml.
    object:
      type: cuboid
      size: [0.02, 0.02, 0.02]
      mass: 0.01
      pos: [-0.25, 0.45, 0.01]
      color: [0.3, 0.3, 0.3]
    # LeHome's garment scene, as near as this PhysX allows (docs/VR.md): its shirt at its
    # scale, 0.45 -- 520 mm sleeve to sleeve, 330 mm collar to hem -- dropped from 0.13 m
    # between the arms, 0.275 m out, sleeves running between the arms. LeHome's particle
    # cloth is gone from this PhysX, so the shirt is a surface deformable with a material
    # tuned by dropping it (docs/VR.md): bend 10, Young 1e5, density 400 (a 140 g shirt).
    # The old reference numbers (1e6 / 1e6 / 1000) landed as a 78 mm shell -- paper, not
    # jersey.
    shirt:
      type: physx_cloth
      usd_path: assets/garment/shirt.usd
      scale: 0.45
      pos: [0.275, 0.0, 0.13]
      rot: [0.0, 0.0, 0.7071068, 0.7071068]
      bend_stiffness: 10.0
      youngs_modulus: 1.0e5
      density: 400.0
      # Cotton on rubber, roughly. The reference's 10 kept the shirt hung over the pads after release.
      static_friction: 1.0
      dynamic_friction: 1.0

  cameras:
    # What the operator sees in the headset. The right arm's wrist camera is the big panel in
    # front; the left arm's wrist camera, the front view and the top view float around it
    # (names sort alphabetically on the page). The wrist cameras ride the grippers: mounted on
    # top of the housing, 10 cm behind the palm and 6 cm above the finger line, tilted 10
    # degrees down, with the 170-degree fisheye the LeRobot wrist camera uses -- both finger
    # tips in the bottom corners of the frame, the table and the object ahead. 20 fps each: one camera render
    # costs 26 ms whatever the settings, so the rate is the only dial (docs/VR.md).
    a_wrist_right:
      type: tiled
      attach: gripper_base
      robot: robot
      prim_path: "{ENV_REGEX_NS}/WristCamRight"
      resolution: [480, 360]
      pos: [0.0, -0.10, 0.06]
      pitch: 10.0
      fisheye: 170.0
      update_period: 0.02   # every env step (docs/VR.md, Smoother in the headset)
    b_wrist_left:
      type: tiled
      attach: gripper_base
      robot: robot2
      prim_path: "{ENV_REGEX_NS}/WristCamLeft"
      resolution: [320, 240]
      pos: [0.0, -0.10, 0.06]
      pitch: 10.0
      fisheye: 170.0
      update_period: 0.02   # every env step (docs/VR.md, Smoother in the headset)
    c_front:
      type: tiled
      prim_path: "{ENV_REGEX_NS}/FrontCam"
      resolution: [320, 240]
      pos: [0.80, -0.45, 0.50]
      look_at: [0.27, 0.0, 0.06]
      focal_length: 18.0
      update_period: 0.08   # every fourth step
    d_top:
      type: tiled
      prim_path: "{ENV_REGEX_NS}/TopCam"
      resolution: [320, 240]
      pos: [0.28, 0.0, 0.80]
      look_at: [0.28, 0.0, 0.0]
      up: [1.0, 0.0, 0.0]
      focal_length: 16.0
      update_period: 0.08   # every fourth step

sim:
  episode_length_s: 600.0   # teleop: nothing here is scored, so do not reset under the operator
  # PhysX on the GPU: the cloth is a deformable and those are GPU-only. The rigid scenes run
  # PhysX on the CPU (0.6 ms a substep against 5.3; configs/vr_teleop_crate.yaml).
  # MEASURED, headless (docs/VR.md, Smoother in the headset): 12.8 steps/s with the wrist
  # cameras rendering every step, 12.8 new frames a second to the headset; 16 steps/s at 5 fps
  # with the old cadence. A quarter of real time; the floor is GPU PhysX, and cloth is GPU-only.
  device: cuda:0

control:
  source: zmq               # the VR bridge answers on this socket
  endpoint: "tcp://127.0.0.1:5555"
  actions: ik               # pose target, not joint offsets -- see the header
  # MEASURED, fake controller, 1100 steps, error between the commanded and actual grasp point:
  #     orientation weight 1.0 (full pose)      mean 224 mm   stuck at a joint limit
  #     orientation weight 0.2                  mean 161 mm   stuck
  #     orientation weight [1, 1, 0]            mean 159 mm   stuck
  #     orientation weight 0.0                  mean  19 mm,  12.5 mm once settled
  # Five joints cannot hold a commanded 6-DoF orientation across this workspace, and DLS
  # trades position away trying. So the arm follows the controller's POSITION and the jaws'
  # orientation follows the arm. docs/VR.md has the table and what that costs at the table.
  # Orientation is commanded RELATIVE to how the fingers pointed when the grip closed (the
  # bridge anchors on the pose the simulator reports), so it starts at zero error. Measured,
  # fake controller turning its wrist 40 degrees during the carry:
  #     weight   orientation error   position error
  #     0.1          17 deg             22 mm        <- this config
  #     0.2          24 deg             60 mm
  #     0.3          16 deg             59 mm
  #     0.0           -- (drifts)        4-20 mm     wrist_roll spins by itself
  ik_orientation_weight: 0.1
  action_horizon: 1
